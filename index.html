<!DOCTYPE html>

  <!-- 自訂核心樣式表 -->

<body class="min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-white">

  <header class="sticky top-0 z-40 w-full backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">

        </div>
        <div>
          <div class="font-extrabold text-base sm:text-lg tracking-tight text-slate-900 dark:text-white flex items-center gap-1.5">
            <span>冒險齒輪</span>
            <span class="text-xs px-2 py-0.5 rounded-full bg-amber-500 text-white font-bold">少兒小說庫</span>
          </div>
          <div class="text-[10px] text-slate-400 font-mono tracking-wider">GEARNOVEL ONLINE</div>
        </div>
      </a>

      <!-- 桌面端導覽選單 -->
      <nav class="hidden md:flex items-center gap-1 text-sm font-medium">
        <a href="#/" class="px-3.5 py-2 rounded-xl text-slate-700 dark:text-slate-200 hover:text-amber-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
          📚 書庫首頁
        </a>
        <a href="#/characters" class="px-3.5 py-2 rounded-xl text-slate-700 dark:text-slate-200 hover:text-amber-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
          👥 人物檔案誌
        </a>
        <a href="#/puzzle-lab" class="px-3.5 py-2 rounded-xl text-slate-700 dark:text-slate-200 hover:text-amber-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
          🧩 密碼實驗室
        </a>
        <a href="#/badges" class="px-3.5 py-2 rounded-xl text-slate-700 dark:text-slate-200 hover:text-amber-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
          🏆 閱讀成就
        </a>
        <button id="nav-bookmarks-btn" class="px-3.5 py-2 rounded-xl text-slate-700 dark:text-slate-200 hover:text-amber-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all flex items-center gap-1.5" title="開啟我的書籤">
          <span>🔖 書籤</span>
          <span id="nav-bookmark-count" class="hidden px-1.5 py-0.5 rounded-full bg-amber-500 text-white text-[10px] font-bold leading-none">0</span>
        </button>
      </nav>

      <!-- 快速主題切換按鈕與使用者登入 -->
      <div class="flex items-center gap-2">
        <button id="nav-theme-toggle" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:text-amber-600 hover:border-amber-500 transition-all text-sm flex items-center gap-1.5" title="切換閱讀主題">
          <span id="theme-icon">📜</span>
          <span id="theme-text" class="text-xs font-semibold hidden sm:inline">護眼紙張</span>
        </button>

        <!-- 桌面端使用者登入狀態容器 -->
        <div id="user-auth-desktop" class="hidden sm:flex items-center"></div>

        <!-- 行動端漢堡選單按鈕 -->
        <button id="mobile-menu-btn" class="md:hidden p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>

    </div>

    <!-- 行動端下拉選單 -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 py-3 space-y-1">
      <a href="#/" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">📚 書庫首頁</a>
      <a href="#/characters" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">👥 人物檔案誌</a>
      <a href="#/puzzle-lab" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">🧩 密碼實驗室</a>
      <a href="#/badges" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">🏆 閱讀成就</a>
      <button id="mobile-bookmarks-btn" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-between">
        <span>🔖 我的書籤</span>
        <span id="mobile-bookmark-count" class="hidden px-1.5 py-0.5 rounded-full bg-amber-500 text-white text-[10px] font-bold leading-none">0</span>
      </button>
      <!-- 行動端使用者登入狀態容器 -->
      <div id="user-auth-mobile" class="pt-2 mt-2 border-t border-slate-200 dark:border-slate-800"></div>
    </div>
  </header>

  <!-- 全域書籤管理彈窗 -->
  <div id="bookmarks-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-center items-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-800 mb-4">
        <div class="flex items-center gap-2">
          <span class="text-xl">🔖</span>
          <h3 class="font-bold text-lg text-slate-900 dark:text-white">我的閱讀書籤</h3>
          <span id="modal-bookmark-total" class="text-xs px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-600 font-bold">0 個書籤</span>
        </div>
        <button id="btn-close-bookmarks" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl font-bold">✕</button>
      </div>
      <div id="bookmarks-list-container" class="overflow-y-auto space-y-2.5 flex-1 pr-1">
        <!-- 動態注入書籤列表 -->
      </div>
    </div>
  </div>

  <!-- 主內容掛載區 -->
  <main id="app-main" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
    <!-- 內容將由 app.js 動態渲染 -->
  </main>

  <!-- 全站頁尾 -->
  <footer class="border-t border-slate-200 dark:border-slate-800 py-10 text-center text-xs text-slate-500 dark:text-slate-400 bg-white/50 dark:bg-slate-900/50">
    <div class="max-w-6xl mx-auto px-4 space-y-3">
      <div class="flex items-center justify-center gap-2 font-bold text-slate-700 dark:text-slate-300">
        <span>⚙️ 冒險齒輪 · 少兒科幻小說庫</span>
        <span>·</span>
        <span>適合 9～13 歲青少年閱讀</span>
      </div>
      <p>專為少年探索者打造的沉浸式解謎小說世界 · 支援全設備自適應與離線閱讀</p>
      <div class="text-[11px] text-slate-400">
        收錄系列：第一套《冒險齒輪：失落的二十四小時》（全三卷 32 章完結）· 第二套《星願鐘擺與織光少女》（全三卷 30 章完結）· 第三套《我的老師不是人》（全三卷 24 章完結）· Powered by GitHub Pages
      </div>
    </div>
  </footer>

  <!-- Firebase SDK (輕量 Realtime Database & Auth 模組) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- 引用配置、資料與服務腳本 -->
  <script src="./js/firebase-config.js"></script>
  <script src="./js/data/series.js"></script>
  <script src="./js/data/books.js"></script>
  <script src="./js/services/stats.js"></script>
  <script src="./js/services/auth.js"></script>
  <script src="./js/app.js"></script>

  <!-- 主題切換輔助腳本 -->
  <script>
    (function() {
      const themeBtn = document.getElementById('nav-theme-toggle');
      const themeIcon = document.getElementById('theme-icon');
      const themeText = document.getElementById('theme-text');
      const mobileBtn = document.getElementById('mobile-menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');

      if (mobileBtn && mobileMenu) {
        mobileBtn.onclick = () => mobileMenu.classList.toggle('hidden');
        mobileMenu.querySelectorAll('a').forEach(a => a.onclick = () => mobileMenu.classList.add('hidden'));
      }

      const themes = ['sepia', 'light', 'dark'];
      const themeConfig = {
        sepia: { icon: '📜', text: '護眼紙張' },
        light: { icon: '☀️', text: '清新純白' },
        dark: { icon: '🌙', text: '深邃星空' }
      };

      function updateThemeBtn() {
        const cur = document.documentElement.getAttribute('data-theme') || 'sepia';
        if (themeConfig[cur]) {
          themeIcon.innerText = themeConfig[cur].icon;
          themeText.innerText = themeConfig[cur].text;
        }
      }

      if (themeBtn) {
        themeBtn.onclick = () => {
          const cur = document.documentElement.getAttribute('data-theme') || 'sepia';
          const next = themes[(themes.indexOf(cur) + 1) % themes.length];
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('gear_novel_theme', next);
          updateThemeBtn();
          window.dispatchEvent(new Event('hashchange'));
        };
      }
      updateThemeBtn();
    })();
  </script>
</body>
</html>
